services:
  - type: web
    name: align-backend
    env: python
    repo: https://github.com/your-username/align-coaching-platform
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000

  - type: web
    name: align-frontend
    env: node
    repo: https://github.com/your-username/align-coaching-platform
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start